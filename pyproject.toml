[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cutin"
version = "0.1.0"
description = "Reproducible cut-in experiments with a highway-env backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "highway-env>=1.10.2,<2",
  "gymnasium>=1.0,<2",
  "numpy>=2,<3",
]

[project.scripts]
cutin = "cutin.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cutin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
